[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.0",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP modern syntax, B bugbear,
# SIM simplifications, ASYNC async pitfalls, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
  "B008",  # function calls in argument defaults (FastAPI's Depends pattern)
  "E501",  # line length is the formatter's job
]

[tool.ruff.format]
quote-style = "double"
