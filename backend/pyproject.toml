[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "en-core-web-lg",
    "fastapi[standard]>=0.163.0",
    "filetype>=1.2.0",
    "gliner>=0.2.30",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "presidio-analyzer>=2.2.366",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP modern syntax, B bugbear,
# SIM simplifications, ASYNC async pitfalls, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
  "B008",  # function calls in argument defaults (FastAPI's Depends pattern)
  "E501",  # line length is the formatter's job
]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
